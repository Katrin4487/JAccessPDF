name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the <java.release> target, 25 the current LTS. README claims
        # both are tested - this is what makes that true.
        java: [ '21', '25' ]

    name: JDK ${{ matrix.java }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # verify, not test: it also runs the license-header check (bound to the
      # verify phase) and builds the javadoc and sources jars, so a javadoc
      # error surfaces here rather than during a release.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7
